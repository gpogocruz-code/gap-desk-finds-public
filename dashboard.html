<style id="v14-styles">
/* GAP Desk Finds · V1.4 */
.analytics-platform-tabs{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:12px;
  margin:16px 0 18px;
}
.platform-tab{
  border:0;
  min-height:76px;
  border-radius:18px;
  padding:14px 16px;
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  cursor:pointer;
  box-shadow:0 10px 28px rgba(40,30,34,.08);
  transition:.18s ease;
  opacity:.82;
}
.platform-tab:hover{transform:translateY(-1px);opacity:1}
.platform-tab.active{opacity:1;box-shadow:0 0 0 4px rgba(184,93,126,.15),0 14px 30px rgba(40,30,34,.12)}
.platform-tab.threads{background:#111}
.platform-tab.pinterest{background:#E60023}
.platform-tab.amazon{background:#232F3E}
.platform-tab .platform-tab-left{display:flex;align-items:center;gap:12px;text-align:left}
.platform-tab img{width:30px;height:30px;object-fit:contain}
.platform-tab b{display:block;font-size:16px}
.platform-tab small{display:block;color:rgba(255,255,255,.78);margin-top:3px}
.platform-tab .chev{font-size:20px;opacity:.9}

.result-toolbar{
  display:flex;
  flex-wrap:wrap;
  align-items:end;
  gap:10px;
  padding:12px;
  margin:0 0 14px;
  border:1px solid var(--line);
  border-radius:16px;
  background:#fffafb;
}
.result-toolbar .filter-group{min-width:145px;flex:0 1 180px}
.result-toolbar label{
  display:block;
  font-size:10px;
  font-weight:800;
  letter-spacing:.04em;
  color:var(--muted);
  text-transform:uppercase;
  margin:0 0 5px;
}
.compact-select{height:40px;padding:0 34px 0 11px}
.filter-summary{margin-left:auto;font-size:12px;color:var(--muted);align-self:center}

.thumb{
  width:58px;height:58px;border-radius:12px;object-fit:cover;
  border:1px solid var(--line);background:#fff5f8;display:block
}
.thumb-placeholder{
  width:58px;height:58px;border-radius:12px;border:1px dashed var(--rose300);
  display:grid;place-items:center;background:#fff8fb;font-size:20px
}
.pin-title-cell{display:flex;align-items:center;gap:12px;min-width:280px}

.calendar-toolbar{
  display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap;
  margin-bottom:16px
}
.segmented{
  display:inline-flex;gap:4px;padding:4px;border:1px solid var(--line);
  border-radius:14px;background:#fff
}
.segmented button{
  border:0;background:transparent;padding:9px 13px;border-radius:10px;
  font-weight:800;color:var(--muted);cursor:pointer
}
.segmented button.active{background:var(--rose100);color:var(--rose700)}
.calendar-filter{
  display:flex;gap:7px;align-items:center;flex-wrap:wrap
}
.calendar-filter button{
  border:1px solid var(--line);background:#fff;padding:8px 12px;border-radius:999px;
  font-weight:800;color:var(--muted);cursor:pointer
}
.calendar-filter button.active{background:var(--rose700);color:#fff;border-color:var(--rose700)}

.month-shell{overflow-x:auto;padding-bottom:4px}
.month-grid{
  min-width:900px;
  display:grid;
  grid-template-columns:repeat(7,minmax(120px,1fr));
  gap:8px;
}
.month-weekday{
  font-size:11px;text-transform:uppercase;letter-spacing:.05em;
  font-weight:900;color:var(--muted);padding:0 8px 5px
}
.month-day{
  min-height:128px;background:#fff;border:1px solid var(--line);border-radius:16px;
  padding:10px;position:relative
}
.month-day.other{opacity:.36}
.month-day.today{box-shadow:inset 0 0 0 2px var(--rose500)}
.month-day-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:7px}
.month-day-head b{font-size:13px}
.month-add{
  width:26px;height:26px;border-radius:9px;border:1px solid var(--line);background:#fff;
  cursor:pointer;font-weight:900
}
.month-event{
  width:100%;text-align:left;border:0;border-radius:9px;padding:6px 7px;margin:0 0 5px;
  cursor:pointer;font-size:10px;font-weight:800;line-height:1.25
}
.month-event.threads{background:#f0f0f1;color:#111}
.month-event.pinterest{background:#ffe8ec;color:#a50019}
.month-event.other{background:#f8edf2;color:#7b5362}
.month-more{font-size:10px;color:var(--muted);font-weight:800;padding:2px 4px}

.analytics-logo-note{display:flex;align-items:center;gap:10px}
.analytics-logo-note img{width:25px;height:25px}
.amazon-accent{color:#ff9900}

@media(max-width:760px){
  .analytics-platform-tabs{grid-template-columns:1fr}
  .platform-tab{min-height:65px}
  .filter-summary{width:100%;margin-left:0}
}
</style>

<body>
<div id="app" class="app"></div>
<div id="modalRoot"></div>
<div id="toastRoot"></div>
<script>
const DB_NAME='gapDeskFindsDBStandalone'; const DB_VERSION=1; let db; let state={section:'home',content:[],products:[],ideas:[],sidebar:false};

const THREADS_DATA_URL='https://zuxyalskyzzzbmwgtxmf.supabase.co/functions/v1/threads-dashboard-data';
const THREADS_CACHE_KEY='gap-desk-finds-threads-live-v1';
function cachedThreadsPayload(){try{return JSON.parse(localStorage.getItem(THREADS_CACHE_KEY)||'{}')}catch{return {}}}
function saveThreadsPayload(v){localStorage.setItem(THREADS_CACHE_KEY,JSON.stringify(v||{}))}
async function loadThreadsData(showToast=false){
  try{
    if(showToast) toast('Actualizando métricas de Threads…');
    const res=await fetch(THREADS_DATA_URL+'?t='+Date.now(),{method:'GET',cache:'no-store'});
    if(!res.ok) throw new Error(await res.text());
    const payload=await res.json();
    if(!payload?.ok) throw new Error(payload?.error||'Respuesta inválida');
    const next={threads:payload.threads||{},lastSync:payload.lastSync||payload.threads?.lastSync||new Date().toISOString(),connections:{threads:'connected',pinterest:'pending',amazon:'pending'}};
    saveThreadsPayload(next);
    localStorage.setItem(REMOTE_METRICS_KEY,JSON.stringify(next));
    render();
    if(showToast) toast('Threads actualizado ✓');
    return next;
  }catch(e){
    console.error('Threads dashboard data',e);
    const current=cachedThreadsPayload();
    if(current?.threads){localStorage.setItem(REMOTE_METRICS_KEY,JSON.stringify(current));}
    if(showToast) toast('No pude actualizar Threads');
    return current;
  }
}

const sectionMeta={home:['🏠','Inicio'],calendar:['📅','Calendario'],threads:['🧵','Threads'],pinterest:['📌','Pinterest'],amazon:['🛍️','Amazon Finds'],ideas:['💡','Banco de ideas'],analytics:['📊','Analytics'],data:['⚙️','Datos']};
const navOrder=['home','calendar','threads','pinterest','amazon','ideas','analytics','data'];
const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
const today=()=>new Date().toISOString().slice(0,10); const dateObj=s=>new Date(s+'T12:00:00');
const dayName=s=>dateObj(s).toLocaleDateString('es-EC',{weekday:'short'}).replace('.','');
const fmtDate=s=>dateObj(s).toLocaleDateString('es-EC',{day:'numeric',month:'short'});
const money=n=>new Intl.NumberFormat('en-US',{style:'currency',currency:'USD'}).format(Number(n||0));
const interactions=c=>(+c.likes||0)+(+c.replies||0)+(+c.reposts||0)+(+c.quotes||0)+(+c.saves||0);
const reach=c=>c.platform==='Pinterest'?(+c.impressions||0):(+c.views||0);
function normText(s){return String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/https?:\/\/\S+/g,' ').replace(/[^a-z0-9ñáéíóúü]+/gi,' ').replace(/\s+/g,' ').trim()}
function usefulTokens(s){const stop=new Set(['que','de','la','el','y','o','un','una','mi','me','en','con','por','para','se','es','lo','las','los','del','al','a','pero','cada','todo','todos','todas','mas','muy','como','ya','si','sin']);return normText(s).split(' ').filter(x=>x.length>2&&!stop.has(x))}
function threadPostPool(){const t=getRemoteMetrics().threads||{};return Array.isArray(t.posts)?t.posts:(Array.isArray(t.topPosts)?t.topPosts:[])}
function threadMatchScore(c,p){if(!p)return 0;if(c.threadId&&String(c.threadId)===String(p.thread_id))return 10;if(c.threadPermalink&&p.permalink&&c.threadPermalink===p.permalink)return 10;let score=0;const cdate=String(c.date||'').slice(0,10),pdate=String(p.posted_at||'').slice(0,10);if(cdate&&pdate&&cdate===pdate)score+=.55;const a=new Set(usefulTokens(c.copy||'')),b=new Set(usefulTokens(p.text||''));if(a.size&&b.size){let common=0;a.forEach(x=>{if(b.has(x))common++});score+=Math.min(.75,common/Math.max(2,Math.min(a.size,b.size))*.75)}return score}
function matchThreadPost(c){if(c.platform!=='Threads'||c.status!=='Publicado')return null;const posts=threadPostPool();if(!posts.length)return null;let best=null,bestScore=0;for(const p of posts){const sc=threadMatchScore(c,p);if(sc>bestScore){best=p;bestScore=sc}}return bestScore>=.52?best:null}
function hydrateThreadRecord(c){if(c.platform!=='Threads')return c;const p=matchThreadPost(c);if(!p)return c;return {...c,threadId:p.thread_id,threadPermalink:p.permalink||c.threadPermalink,views:+p.views||0,likes:+p.likes||0,replies:+p.replies||0,reposts:+p.reposts||0,quotes:+p.quotes||0,shares:+p.shares||0,_liveMatched:true,_livePost:p}}
const engagement=c=>reach(c)?interactions(c)/reach(c)*100:0; const pc=n=>(+n||0).toFixed(2)+'%';
const statusClass=s=>'status status-'+String(s).toLowerCase();

function openDB(){return new Promise((res,rej)=>{const r=indexedDB.open(DB_NAME,DB_VERSION);r.onupgradeneeded=e=>{const d=e.target.result;if(!d.objectStoreNames.contains('content'))d.createObjectStore('content',{keyPath:'id',autoIncrement:true});if(!d.objectStoreNames.contains('products'))d.createObjectStore('products',{keyPath:'id',autoIncrement:true});if(!d.objectStoreNames.contains('ideas'))d.createObjectStore('ideas',{keyPath:'id',autoIncrement:true})};r.onsuccess=()=>{db=r.result;res(db)};r.onerror=()=>rej(r.error)})}
function store(name,mode='readonly'){return db.transaction(name,mode).objectStore(name)}
function getAll(name){return new Promise((res,rej)=>{const r=store(name).getAll();r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
function put(name,obj){return new Promise((res,rej)=>{const r=store(name,'readwrite').put(obj);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
function add(name,obj){return new Promise((res,rej)=>{const r=store(name,'readwrite').add(obj);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
function del(name,id){return new Promise((res,rej)=>{const r=store(name,'readwrite').delete(id);r.onsuccess=()=>res();r.onerror=()=>rej(r.error)})}
function clearStore(name){return new Promise((res,rej)=>{const r=store(name,'readwrite').clear();r.onsuccess=()=>res();r.onerror=()=>rej(r.error)})}
async function refresh(){state.content=(await getAll('content')).sort((a,b)=>b.date.localeCompare(a.date));state.products=(await getAll('products')).sort((a,b)=>a.name.localeCompare(b.name));state.ideas=(await getAll('ideas')).sort((a,b)=>(b.createdAt||'').localeCompare(a.createdAt||''));render()}
async function seed(){if((await getAll('content')).length)return;const seeds=[
{date:'2026-09-10',dayLabel:'Día 1',platform:'Threads',type:'Pregunta',copy:'¿Qué accesorio no puede faltar en tu escritorio?',topic:'Desk essentials',status:'Publicado',views:660,likes:3,replies:5,reposts:0,followersGained:0,notes:'Alto alcance para una pregunta abierta.'},
{date:'2026-09-11',dayLabel:'Día 2',platform:'Threads',type:'Pregunta',copy:'¿Team escritorio minimalista o lleno de cositas cute?',topic:'Desk style',status:'Publicado',views:18,likes:0,replies:0,reposts:0,followersGained:0,notes:'Rendimiento bajo.'},
{date:'2026-09-12',dayLabel:'Día 3',platform:'Threads',type:'Foto real + relatable',copy:'Foto real de mi setup + comentario relatable.',topic:'Real setup',status:'Publicado',views:277,likes:18,replies:3,reposts:0,followersGained:0,notes:'Mejor interacción hasta ahora.'},
{date:'2026-09-13',dayLabel:'Día 4',platform:'Threads',type:'Foto detalle',copy:'Detalle de teclado, mouse y mousepad rosa + texto personal.',topic:'Pink desk details',status:'Publicado',notes:'Pendiente de ingresar métricas.'}
];for(const x of seeds)await add('content',x);await add('ideas',{title:'Antes/después de ordenar el escritorio',category:'Faceless',notes:'Idea visual simple para futuras pruebas.',createdAt:new Date().toISOString()});await add('ideas',{title:'Top accesorios rosa para home office',category:'Producto',notes:'Relacionar con Amazon Finds.',createdAt:new Date().toISOString()})}
function analytics(){const p=state.content.filter(c=>c.status==='Publicado').map(hydrateThreadRecord),tot=p.reduce((s,c)=>s+reach(c),0),ints=p.reduce((s,c)=>s+interactions(c),0);const bestReach=[...p].sort((a,b)=>reach(b)-reach(a))[0],bestEng=[...p].sort((a,b)=>engagement(b)-engagement(a))[0];const formats={};p.forEach(c=>{formats[c.type||'Sin formato']??={base:0,int:0};formats[c.type||'Sin formato'].base+=reach(c);formats[c.type||'Sin formato'].int+=interactions(c)});const bestFormat=Object.entries(formats).sort((a,b)=>(b[1].base?b[1].int/b[1].base:0)-(a[1].base?a[1].int/a[1].base:0))[0]?.[0]||'—';return{published:p.length,total:tot,ints,avg:tot?ints/tot*100:0,followers:p.reduce((s,c)=>s+(+c.followersGained||0),0),amazon:state.content.reduce((s,c)=>s+(+c.amazonClicks||0),0)+state.products.reduce((s,p)=>s+(+p.clicks||0),0),bestReach,bestEng,bestFormat}}
function navHTML(){return navOrder.map(id=>`<button class="${state.section===id?'active':''}" onclick="go('${id}')"><span>${sectionMeta[id][0]}</span>${sectionMeta[id][1]}</button>`).join('')}
function shell(body){const [ic,title]=sectionMeta[state.section];return `<div class="overlay ${state.sidebar?'open':''}" onclick="toggleSidebar(false)"></div><aside class="sidebar ${state.sidebar?'open':''}"><div class="brand"><b>✨ GAP Desk Finds</b><small>Content Dashboard · V1.2.1</small></div><nav class="nav">${navHTML()}</nav><div class="save-note"><b>Guardado local</b>Tus datos viven en este navegador mediante IndexedDB.</div></aside><main class="main"><header class="topbar"><div style="display:flex;align-items:center;gap:10px"><button class="mobile-menu" onclick="toggleSidebar(true)">☰</button><div><h1>${ic} ${title}</h1><p>Organiza, registra y aprende de tu contenido.</p></div></div>${topAction()}</header><div class="content">${body}</div></main><nav class="mobile-bottom">${['home','calendar','threads','analytics'].map(id=>`<button class="${state.section===id?'active':''}" onclick="go('${id}')"><span class="mi">${sectionMeta[id][0]}</span>${sectionMeta[id][1]}</button>`).join('')}<button onclick="toggleSidebar(true)"><span class="mi">☰</span>Más</button></nav>`}
function topAction(){if(['calendar','threads','pinterest'].includes(state.section))return `<button class="btn primary" onclick="openContent(null,'${state.section==='pinterest'?'Pinterest':state.section==='threads'?'Threads':''}')">＋ <span class="desktop-label">Nueva publicación</span></button>`;if(state.section==='amazon')return `<button class="btn primary" onclick="openProduct()">＋ <span class="desktop-label">Nuevo producto</span></button>`;if(state.section==='ideas')return `<button class="btn primary" onclick="openIdea()">＋ <span class="desktop-label">Nueva idea</span></button>`;return''}
function go(id){state.section=id;state.sidebar=false;render();scrollTo(0,0)}function toggleSidebar(v){state.sidebar=v;render()}
function render(){let b='';if(state.section==='home')b=homeView();if(state.section==='calendar')b=calendarView();if(state.section==='threads')b=platformView('Threads');if(state.section==='pinterest')b=platformView('Pinterest');if(state.section==='amazon')b=amazonView();if(state.section==='ideas')b=ideasView();if(state.section==='analytics')b=analyticsView();if(state.section==='data')b=dataView();document.getElementById('app').innerHTML=shell(b)}
function metric(label,value,note,icon){return `<div class="card metric"><div class="label">${icon} ${esc(label)}</div><div class="value">${esc(value)}</div><div class="note">${esc(note||'')}</div></div>`}
function homeView(){const a=analytics(),pend=state.content.filter(c=>c.status==='Pendiente').length,prep=state.content.filter(c=>c.status==='Preparado').length;return `<section class="hero"><span class="pill">✨ GAP DESK FINDS · V1.2.1</span><h2>Tu contenido, productos y métricas en un solo lugar. 🎀</h2><p>Esta V1 ya guarda tu información en el navegador y conecta calendario, contenido, Amazon Finds y analytics.</p><div class="hero-actions"><button class="btn primary" onclick="openContent()">＋ Añadir contenido</button><button class="btn secondary" onclick="go('analytics')">Ver analytics →</button></div></section><section class="grid metrics gap12">${metric('Publicados',a.published,'registros publicados','📦')}${metric('Alcance',a.total.toLocaleString(),'vistas + impresiones','📊')}${metric('Interacciones',a.ints,'Engagement '+pc(a.avg),'✨')}${metric('Clics Amazon',a.amazon,state.products.length+' productos','🛍️')}${metric('Ideas',state.ideas.length,pend+' pendientes · '+prep+' preparados','💡')}</section><section class="grid home-lower gap20"><div class="card p20"><div class="section-head"><div><h2 style="font-size:18px">Rendimiento destacado</h2><p>Lo mejor de tus datos actuales.</p></div><button class="btn ghost" onclick="go('analytics')">Analizar</button></div><div class="grid highlights gap12">${highlight('Mayor alcance',a.bestReach,a.bestReach?reach(a.bestReach).toLocaleString()+' alcance':'Sin datos')}${highlight('Mayor interacción',a.bestEng,a.bestEng?pc(engagement(a.bestEng))+' engagement':'Sin datos')}</div></div><div class="card p20"><h2 style="font-size:18px;margin:0">Estado del contenido</h2><div class="state-list">${['Idea','Pendiente','Preparado','Publicado'].map(s=>`<div class="state-row"><span class="${statusClass(s)}">${s}</span><b>${state.content.filter(c=>c.status===s).length}</b></div>`).join('')}</div></div></section>`}
function highlight(title,item,val){return `<div class="highlight"><div class="kicker">${title}</div><strong>${esc(item?.copy||'Todavía no hay suficientes datos')}</strong><p>${esc(val)}</p><small class="muted">${item?esc(item.platform+' · '+item.type):''}</small></div>`}
function weekDays(){const d=new Date(),day=d.getDay(),diff=day===0?-6:1-day;d.setDate(d.getDate()+diff);d.setHours(12,0,0,0);return Array.from({length:7},(_,i)=>{const x=new Date(d);x.setDate(d.getDate()+i);return{iso:x.toISOString().slice(0,10),long:x.toLocaleDateString('es-EC',{weekday:'long'}),short:x.toLocaleDateString('es-EC',{day:'numeric',month:'short'})}})}
function calendarView(){const days=weekDays();return `<div class="section-head"><div><h2>Semana actual</h2><p>Planifica de lunes a domingo y abre cualquier tarjeta para editarla.</p></div><span class="pill">${days[0].short} — ${days[6].short}</span></div><div class="grid week">${days.map(d=>{const items=state.content.filter(c=>c.date===d.iso);return `<div class="card day"><div class="day-head"><div><b>${esc(d.long)}</b><small>${esc(d.short)}</small></div><button class="icon-btn" onclick="openContentForDate('${d.iso}')">＋</button></div>${items.length?items.map(c=>pubCard(c)).join(''):`<button class="empty-add" onclick="openContentForDate('${d.iso}')">＋ Añadir contenido</button>`}</div>`}).join('')}</div>`}
function pubCard(c){const prod=state.products.find(p=>p.id===c.productId);return `<button class="pub-card" onclick="openContent(${c.id})"><div class="top"><span class="platform">${esc(c.platform)}</span><span class="${statusClass(c.status)}">${esc(c.status)}</span></div><p>${esc(c.copy||c.pinterestTitle||c.type||'Sin copy')}</p>${prod?`<small class="muted">🛍️ ${esc(prod.name)}</small>`:''}</button>`}
function platformView(platform){const rows=state.content.filter(c=>c.platform===platform);return `<div class="section-head"><div><h2>${platform}</h2><p>Registra cada publicación y añade métricas cuando estén disponibles.</p></div></div><div class="search"><span>⌕</span><input class="input" placeholder="Buscar por copy, tema o formato…" oninput="filterPlatform(this.value,'${platform}')" id="platformSearch"></div><div id="platformResults">${platformResults(rows,platform)}</div>`}
function platformResults(rows,platform){rows=rows.map(c=>platform==='Threads'?hydrateThreadRecord(c):c);if(!rows.length)return `<div class="card empty"><div class="bubble">✨</div><p>No hay contenido de ${platform} todavía.</p></div>`;return `<div class="card table-card table-wrap"><table class="table"><thead><tr><th>Fecha / contenido</th><th>Formato</th><th>Tema</th><th>Alcance</th><th>Interacciones</th><th>Engagement</th><th>Estado</th><th></th></tr></thead><tbody>${rows.map(c=>`<tr><td class="copy">${esc(c.copy||c.pinterestTitle||'Sin copy')}<br><small class="muted">${esc(c.date)}${c._liveMatched?' · 🟢 métricas API':''}</small></td><td>${esc(c.type||'—')}</td><td>${esc(c.topic||'—')}</td><td><b>${reach(c)||'—'}</b></td><td>${interactions(c)}</td><td><b style="color:var(--rose700)">${pc(engagement(c))}</b></td><td><span class="${statusClass(c.status)}">${esc(c.status)}</span></td><td><button class="icon-btn" onclick="openContent(${c.id})">✎</button></td></tr>`).join('')}</tbody></table></div><div class="cards-mobile">${rows.map(c=>`<div class="card p20">${c.image?`<img class="product-img" style="width:100%;height:150px" src="${c.image}">`:''}<div style="display:flex;justify-content:space-between;gap:7px"><small class="muted">${esc(c.date)}${c._liveMatched?' · 🟢 API':''}</small><span class="${statusClass(c.status)}">${esc(c.status)}</span></div><h3>${esc(c.copy||c.pinterestTitle||'Sin copy')}</h3><small class="muted">${esc(c.type||'')} · ${esc(c.topic||'')}</small><div class="grid mini-grid" style="margin-top:14px"><div class="mini"><small>Alcance</small><b>${reach(c)}</b></div><div class="mini"><small>Interac.</small><b>${interactions(c)}</b></div><div class="mini"><small>Eng.</small><b>${pc(engagement(c))}</b></div></div><button class="btn secondary" style="width:100%;margin-top:13px" onclick="openContent(${c.id})">✎ Editar</button></div>`).join('')}</div>`}
function filterPlatform(q,platform){q=q.toLowerCase();const rows=state.content.filter(c=>c.platform===platform&&`${c.copy||''} ${c.topic||''} ${c.type||''}`.toLowerCase().includes(q));document.getElementById('platformResults').innerHTML=platformResults(rows,platform)}
function amazonView(){return `<div class="section-head"><div><h2>Amazon Finds</h2><p>Tu catálogo de productos afiliados y el contenido relacionado.</p></div></div>${!state.products.length?`<div class="card empty"><div class="bubble">🛍️</div><p>Aún no tienes productos. Añade tu primer Amazon Find.</p></div>`:`<div class="grid product-grid gap16">${state.products.map(p=>{const rel=state.content.filter(c=>c.productId===p.id);return `<div class="card p20"><div class="product-top">${p.image?`<img class="product-img" src="${p.image}">`:`<div class="product-img" style="display:grid;place-items:center">📦</div>`}<div><div class="category">${esc(p.category||'Producto')}</div><h3>${esc(p.name)}</h3><b>${p.price?money(p.price):'Precio sin registrar'}</b></div></div><div class="grid mini-grid" style="margin-top:16px"><div class="mini"><small>Contenido</small><b>${rel.length}</b></div><div class="mini"><small>Clics</small><b>${+p.clicks||0}</b></div><div class="mini"><small>Conversiones</small><b>${+p.conversions||0}</b></div></div><div class="divider"></div><div style="display:flex;justify-content:space-between;align-items:center"><small class="muted">Comisión: ${money(p.commission)}</small><div><button class="icon-btn" onclick="openProduct(${p.id})">✎</button></div></div></div>`}).join('')}</div>`}`}

function analyticsView(){const a=analytics(),remote=getRemoteMetrics();const threadsLocal=state.content.filter(c=>c.platform==='Threads'&&c.status==='Publicado');const pinLocal=state.content.filter(c=>c.platform==='Pinterest'&&c.status==='Publicado');const tViews=remote.threads?.views??threadsLocal.reduce((s,c)=>s+(+c.views||0),0),tLikes=remote.threads?.likes??threadsLocal.reduce((s,c)=>s+(+c.likes||0),0),tReplies=remote.threads?.replies??threadsLocal.reduce((s,c)=>s+(+c.replies||0),0),tReposts=remote.threads?.reposts??threadsLocal.reduce((s,c)=>s+(+c.reposts||0),0),tQuotes=remote.threads?.quotes??0,tFollowers=remote.threads?.followers??0,tEng=tViews?((tLikes+tReplies+tReposts+tQuotes)/tViews*100):0;const pImp=remote.pinterest?.impressions??pinLocal.reduce((s,c)=>s+(+c.impressions||0),0),pEng=remote.pinterest?.engagements??pinLocal.reduce((s,c)=>s+interactions(c),0),pSave=remote.pinterest?.saves??pinLocal.reduce((s,c)=>s+(+c.saves||0),0),pClick=remote.pinterest?.pinClicks??pinLocal.reduce((s,c)=>s+(+c.clicks||0),0),pOut=remote.pinterest?.outboundClicks??pinLocal.reduce((s,c)=>s+(+c.amazonClicks||0),0),pRate=pImp?pEng/pImp*100:0;const am=remote.amazon||{},last=remote.lastSync?new Date(remote.lastSync).toLocaleString('es-EC'):'Aún no sincronizado';return `<div class="section-head"><div><h2>Analytics</h2><p>Solo Threads, Pinterest y Amazon Afiliados. Preparado para sincronización automática.</p></div></div><div class="sync-strip"><div><b>Sincronización de métricas</b><div class="meta">Última actualización: ${esc(last)}</div></div><button class="btn primary" onclick="syncNow()">↻ Actualizar ahora</button></div><div class="grid integration-grid"><div class="card integration-card"><div class="connection-row"><div><div class="category">🧵 Threads</div><h3 style="margin:5px 0 0">Rendimiento</h3></div>${connectionBadge(remote.connections?.threads)}</div><div class="platform-kpis"><div class="platform-kpi"><small>Visualizaciones</small><b>${(+tViews||0).toLocaleString()}</b></div><div class="platform-kpi"><small>Engagement</small><b>${pc(tEng)}</b></div><div class="platform-kpi"><small>Likes</small><b>${(+tLikes||0).toLocaleString()}</b></div><div class="platform-kpi"><small>Respuestas</small><b>${(+tReplies||0).toLocaleString()}</b></div><div class="platform-kpi"><small>Reposts + quotes</small><b>${(+tReposts||0)+(+tQuotes||0)}</b></div><div class="platform-kpi"><small>Seguidores</small><b>${(+tFollowers||0).toLocaleString()}</b></div></div><div class="divider"></div><small class="muted">La V1.1 usa tus datos locales hasta que conectemos la API de Threads.</small></div><div class="card integration-card"><div class="connection-row"><div><div class="category">📌 Pinterest</div><h3 style="margin:5px 0 0">Rendimiento</h3></div>${connectionBadge(remote.connections?.pinterest)}</div><div class="platform-kpis"><div class="platform-kpi"><small>Impresiones</small><b>${(+pImp||0).toLocaleString()}</b></div><div class="platform-kpi"><small>Engagement</small><b>${pc(pRate)}</b></div><div class="platform-kpi"><small>Guardados</small><b>${(+pSave||0).toLocaleString()}</b></div><div class="platform-kpi"><small>Pin clicks</small><b>${(+pClick||0).toLocaleString()}</b></div><div class="platform-kpi"><small>Outbound clicks</small><b>${(+pOut||0).toLocaleString()}</b></div><div class="platform-kpi"><small>Engagements</small><b>${(+pEng||0).toLocaleString()}</b></div></div><div class="divider"></div><small class="muted">Al conectar Pinterest Business, estas métricas llegarán directamente desde Pinterest.</small></div><div class="card integration-card earnings-card"><div class="connection-row"><div><div class="category">🛍️ Amazon Afiliados</div><h3 style="margin:5px 0 0">Earnings</h3></div>${connectionBadge(remote.connections?.amazon)}</div><div class="platform-kpis"><div class="platform-kpi"><small>Earnings</small><b>${money(am.earnings||0)}</b></div><div class="platform-kpi"><small>Clicks</small><b>${(+am.clicks||0).toLocaleString()}</b></div><div class="platform-kpi"><small>Ordered items</small><b>${(+am.orderedItems||0).toLocaleString()}</b></div><div class="platform-kpi"><small>Shipped items</small><b>${(+am.shippedItems||0).toLocaleString()}</b></div><div class="platform-kpi"><small>Conversion</small><b>${pc(am.conversion||0)}</b></div><div class="platform-kpi"><small>Revenue</small><b>${money(am.revenue||0)}</b></div></div><div class="divider"></div><small class="muted">La conexión automática requiere acceso a Creators API / Reporting API de tu cuenta de Amazon Associates.</small></div></div><div class="card p24" style="margin-top:20px"><div class="section-head"><div><h2 style="font-size:19px">Estado de conexiones</h2><p>No guardaremos contraseñas en este archivo.</p></div><button class="btn secondary" onclick="openConnections()">Configurar conexiones</button></div><div class="setup-steps"><div class="setup-step"><span>1</span><div><b>Threads:</b> Meta Developer App + permisos <code>threads_basic</code> y <code>threads_manage_insights</code>.</div></div><div class="setup-step"><span>2</span><div><b>Pinterest:</b> cuenta Business + Developer App + permisos de lectura de cuenta y Pins.</div></div><div class="setup-step"><span>3</span><div><b>Amazon:</b> Partner Tag y acceso aprobado a Creators API/Reporting API.</div></div></div></div>`}
const REMOTE_METRICS_KEY='gap-desk-finds-v1-1-remote';
function getRemoteMetrics(){try{return JSON.parse(localStorage.getItem(REMOTE_METRICS_KEY)||'{}')}catch{return {}}}
function saveRemoteMetrics(v){localStorage.setItem(REMOTE_METRICS_KEY,JSON.stringify(v))}
function connectionBadge(s){const ok=s==='connected',txt=ok?'Conectado':s==='error'?'Error':'Pendiente';return `<span class="connection-badge ${ok?'ok':s==='error'?'':'off'}"><span class="dot"></span>${txt}</span>`}
function openConnections(){const r=getRemoteMetrics();modal('Conexiones automáticas',`<div class="modal-body"><div class="notice">Por seguridad, los tokens y secretos NO se guardan dentro de este HTML. Se almacenarán en el backend seguro de Supabase.</div><div class="subbox"><b>🧵 Threads</b><p class="muted" style="margin:0">Necesita Meta Developer App, App ID y autorización de tu cuenta Threads para analytics.</p></div><div class="subbox"><b>📌 Pinterest</b><p class="muted" style="margin:0">Necesita Pinterest Business + Developer App y autorización OAuth.</p></div><div class="subbox"><b>🛍️ Amazon Associates</b><p class="muted" style="margin:0">Necesita Partner Tag y, si tu cuenta es elegible, credenciales de Creators API con Reporting API.</p></div><div class="modal-actions"><button class="btn primary" onclick="closeModal()">Entendido</button></div></div>`)}
async function syncNow(){const r=getRemoteMetrics();if(!r.backendUrl){openConnections();toast('Primero debemos conectar el backend seguro');return}try{toast('Sincronizando…');const token=r.sessionToken||'';const headers={Authorization:`Bearer ${token}`,'Content-Type':'application/json'};const names=['threads','pinterest','amazon'];const next={...r,connections:{...(r.connections||{})}};for(const name of names){try{const res=await fetch(`${r.backendUrl.replace(/\/$/,'')}/sync-${name}`,{method:'POST',headers});if(!res.ok)throw new Error(await res.text());next[name]=await res.json();next.connections[name]='connected'}catch(e){next.connections[name]='error';console.error(name,e)}}next.lastSync=new Date().toISOString();saveRemoteMetrics(next);render();toast('Sincronización terminada')}catch(e){console.error(e);toast('No se pudo sincronizar')}}
function lineSvg(pub){const vals=pub.map(engagement),max=Math.max(1,...vals),n=Math.max(1,pub.length-1);const pts=vals.map((v,i)=>`${5+i/n*90},${92-v/max*82}`).join(' ');return `<div class="line-chart"><svg viewBox="0 0 100 100" preserveAspectRatio="none"><polyline fill="none" stroke="#a95d79" stroke-width="2.3" points="${pts}" vector-effect="non-scaling-stroke"/>${vals.map((v,i)=>`<circle cx="${5+i/n*90}" cy="${92-v/max*82}" r="1.8" fill="#a95d79"/>`).join('')}</svg><div style="display:flex;justify-content:space-between;margin-top:-2px">${pub.map(c=>`<small class="muted" style="font-size:8px">${esc(c.dayLabel||c.date.slice(5))}</small>`).join('')}</div></div>`}
function dataView(){return `<div class="section-head"><div><h2>Datos y backup</h2><p>Protege tus datos locales y llévalos a otro navegador cuando lo necesites.</p></div></div><div class="grid data-grid gap20"><div class="card p24"><div style="font-size:25px">⬇️</div><h3>Exportar backup</h3><p class="muted">Descarga publicaciones, productos e ideas en un archivo JSON.</p><button class="btn primary" onclick="exportBackup()">⬇️ Descargar backup</button></div><div class="card p24"><div style="font-size:25px">⬆️</div><h3>Importar backup</h3><p class="muted">Restaura un backup previo. Reemplazará los datos del navegador actual.</p><label class="btn secondary">⬆️ Elegir archivo<input class="hidden" type="file" accept="application/json" onchange="importBackup(this.files[0])"></label></div></div><div class="card p20" style="margin-top:20px"><b>Cómo funciona el guardado en V1.1</b><p class="muted" style="font-size:13px">Tu contenido local sigue guardándose mediante IndexedDB. Las credenciales de plataformas nunca se guardarán aquí: la V1.1 usa un backend seguro para sincronizar Analytics cuando terminemos las conexiones.</p></div>`}

function field(label,input){return `<div class="field"><label>${esc(label)}</label>${input}</div>`}function val(v){return esc(v??'')}function num(v){return v??''}

function isoLocalDate(d){
  const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),day=String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
function withinPeriod(dateValue,period){
  if(period==='all'||!dateValue)return true;
  const d=new Date(dateValue);
  if(Number.isNaN(d.getTime()))return true;
  const days=period==='7d'?7:period==='30d'?30:period==='90d'?90:36500;
  return d.getTime()>=Date.now()-days*86400000;
}

threadTopFilters.customMode = threadTopFilters.customMode || 'month';
threadTopFilters.customMonth = threadTopFilters.customMonth || new Date().toISOString().slice(0,7);
threadTopFilters.customWeek = threadTopFilters.customWeek || (() => {
  const d=new Date();
  const tmp=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));
  const day=tmp.getUTCDay()||7;
  tmp.setUTCDate(tmp.getUTCDate()+4-day);
  const y=tmp.getUTCFullYear();
  const yearStart=new Date(Date.UTC(y,0,1));
  const w=Math.ceil((((tmp-yearStart)/86400000)+1)/7);
  return `${y}-W${String(w).padStart(2,'0')}`;
})();

pinterestEditorialFilters.customWeek = pinterestEditorialFilters.customWeek || threadTopFilters.customWeek;

function isoWeekStart(weekValue){
  const m=String(weekValue||'').match(/^(\d{4})-W(\d{2})$/);
  if(!m)return null;
  const year=+m[1],week=+m[2];
  const jan4=new Date(Date.UTC(year,0,4));
  const jan4Day=jan4.getUTCDay()||7;
  const monday=new Date(jan4);
  monday.setUTCDate(jan4.getUTCDate()-(jan4Day-1)+(week-1)*7);
  return monday;
}
function customPeriodMatch(dateValue,filters){
  if(!dateValue)return true;
  const d=new Date(dateValue);
  if(Number.isNaN(d.getTime()))return true;
  if(filters.period!=='custom')return withinPeriod(dateValue,filters.period);

  if(filters.customMode==='month'){
    const ym=filters.customMonth;
    if(!ym)return true;
    const localYm=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
    return localYm===ym;
  }

  if(filters.customMode==='week'){
    const start=isoWeekStart(filters.customWeek);
    if(!start)return true;
    const end=new Date(start);
    end.setUTCDate(start.getUTCDate()+7);
    return d.getTime()>=start.getTime() && d.getTime()<end.getTime();
  }
  return true;
}

function ymd(d){
  const x=new Date(d);
  const y=x.getFullYear(),m=String(x.getMonth()+1).padStart(2,'0'),day=String(x.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
function defaultRangeStart(){
  const d=new Date();
  d.setDate(d.getDate()-6);
  return ymd(d);
}
function defaultRangeEnd(){
  return ymd(new Date());
}

function customPeriodMatch(dateValue,filters){
  if(!dateValue)return true;
  const d=new Date(dateValue);
  if(Number.isNaN(d.getTime()))return true;

  if(filters.period!=='custom'){
    return withinPeriod(dateValue,filters.period);
  }

  const start = filters.customStart ? new Date(`${filters.customStart}T00:00:00`) : null;
  const end = filters.customEnd ? new Date(`${filters.customEnd}T23:59:59`) : null;

  if(start && d < start) return false;
  if(end && d > end) return false;
  return true;
}

const rangePickerState = {

};

function scopeFilters(scope){
  if(scope==='threads') return threadTopFilters;
  if(scope==='pinTop') return pinterestTopFilters;
  return pinterestEditorialFilters;
}
function scopeSetterName(scope){
  if(scope==='threads') return 'setThreadCustom';
  if(scope==='pinTop') return 'setPinterestTopCustom';
  return 'setPinterestEditorialCustom';
}
function monthKeyFromDateValue(v){
  if(v && /^\d{4}-\d{2}-\d{2}$/.test(v)) return v.slice(0,7);
  const d=new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
}
function getPickerMonth(scope,filters){
  if(!rangePickerState[scope].month){
    rangePickerState[scope].month=monthKeyFromDateValue(filters.customStart||filters.customEnd);
  }
  return rangePickerState[scope].month;
}
function shiftRangeMonth(scope,delta){
  const filters=scopeFilters(scope);
  const key=getPickerMonth(scope,filters);
  const [y,m]=key.split('-').map(Number);
  const d=new Date(y,m-1+delta,1);
  rangePickerState[scope].month=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
  render();
}
function setRangeToday(scope){
  const filters=scopeFilters(scope);
  const setter=scopeSetterName(scope);
  const t=todayYMD();
  filters.customStart=t;

  rangePickerState[scope].month=t.slice(0,7);
  rangePickerState[scope].phase='end';
  render();
}
function pickRangeDate(scope,dateValue){
  const filters=scopeFilters(scope);
  const phase=rangePickerState[scope].phase||'start';

  if(phase==='start' || !filters.customStart){
    filters.customStart=dateValue;
    filters.customEnd=dateValue;
    rangePickerState[scope].phase='end';
  }else{
    const a=new Date(`${filters.customStart}T00:00:00`);
    const b=new Date(`${dateValue}T00:00:00`);
    if(b<a){
      filters.customEnd=filters.customStart;
      filters.customStart=dateValue;
    }else{
      filters.customEnd=dateValue;
    }
    rangePickerState[scope].phase='start';

}
function inSelectedRange(dateValue,filters){
  if(!filters.customStart || !filters.customEnd) return false;
  const d=new Date(`${dateValue}T12:00:00`);
  const a=new Date(`${filters.customStart}T00:00:00`);
  const b=new Date(`${filters.customEnd}T23:59:59`);

}
function formatRangeDate(v){
  if(!v) return '—';
  const [y,m,d]=v.split('-');
  return `${d}/${m}/${y}`;
}
function rangeCalendar(scope,filters){
  const key=getPickerMonth(scope,filters);
  const [year,month]=key.split('-').map(Number);
  const first=new Date(year,month-1,1,12);
  const startOffset=(first.getDay()+6)%7; // Monday = 0
  const gridStart=new Date(first);
  gridStart.setDate(first.getDate()-startOffset);

  const cells=Array.from({length:42},(_,i)=>{
    const d=new Date(gridStart);
    d.setDate(gridStart.getDate()+i);
    return d;
  });

  const monthTitle=first.toLocaleDateString('es-EC',{month:'long',year:'numeric'});
  const today=todayYMD();

  return `<div class="range-calendar">
    <div class="range-calendar-head">
      <button class="range-nav" type="button" onclick="shiftRangeMonth('${scope}',-1)">‹</button>
      <b>${esc(monthTitle)}</b>
      <div style="display:flex;gap:6px;align-items:center">
        <button class="today-btn" type="button" onclick="setRangeToday('${scope}')">Hoy</button>
        <button class="range-nav" type="button" onclick="shiftRangeMonth('${scope}',1)">›</button>
      </div>
    </div>
    <div class="range-weekdays">${['Lu','Ma','Mi','Ju','Vi','Sa','Do'].map(x=>`<span>${x}</span>`).join('')}</div>
    <div class="range-days">
      ${cells.map(d=>{
        const iso=ymd(d);
        const other=d.getMonth()!==(month-1);
        const selected=inSelectedRange(iso,filters);
        const isStart=iso===filters.customStart;
        const isEnd=iso===filters.customEnd;
        return `<button type="button"
          class="range-day ${other?'other':''} ${selected?'in-range':''} ${isStart?'range-start':''} ${isEnd?'range-end':''} ${iso===today?'today':''}"
          onclick="pickRangeDate('${scope}','${iso}')">${d.getDate()}</button>`;
      }).join('')}
    </div>
  </div>`;
}

function customPeriodControls(scope,filters){

function closeAllRangeOverlays(exceptId=''){
  document.querySelectorAll('.range-overlay.open').forEach(el=>{
    if(!exceptId || el.id!==exceptId) el.classList.remove('open');
  });
}
function toggleRangeOverlay(scope,event){
  if(event) event.stopPropagation();
  const id=`range-overlay-${scope}`;
  const el=document.getElementById(id);
  if(!el)return;
  const willOpen=!el.classList.contains('open');
  closeAllRangeOverlays(id);
  el.classList.toggle('open',willOpen);
}
function keepRangeOverlayOpen(event){
  if(event) event.stopPropagation();
}
if(!window.__gapRangeOverlayListener){
  document.addEventListener('click',()=>closeAllRangeOverlays());
  window.__gapRangeOverlayListener=true;
}

function customPeriodControls(scope,filters){
  if(filters.period!=='custom')return '';

        </button>
      </div>

    <div id="range-overlay-${scope}" class="range-overlay" onclick="keepRangeOverlayOpen(event)">
      ${rangeCalendar(scope,filters)}
      <div class="range-overlay-hint">
        ${phase==='end'
          ? 'Selecciona el día final. El intervalo queda marcado en rosa pastel.'
          : 'Selecciona el día inicial. Después elige el día final.'}
      </div>
    </div>
  </div>`;
}

function pickRangeDate(scope,dateValue){
  const filters=scopeFilters(scope);
  const phase=rangePickerState[scope].phase||'start';

  if(phase==='start' || !filters.customStart){
    filters.customStart=dateValue;
    filters.customEnd=dateValue;
    rangePickerState[scope].phase='end';
  }else{
    const a=new Date(`${filters.customStart}T00:00:00`);
    const b=new Date(`${dateValue}T00:00:00`);
    if(b<a){
      filters.customEnd=filters.customStart;
      filters.customStart=dateValue;
    }else{
      filters.customEnd=dateValue;
    }
    rangePickerState[scope].phase='start';
  }

  // Re-renderiza datos, y vuelve a abrir el overlay para que no "salte" la interfaz.
  render();
  requestAnimationFrame(()=>{
    const el=document.getElementById(`range-overlay-${scope}`);
    if(el) el.classList.add('open');
  });
}

function shiftRangeMonth(scope,delta){
  const filters=scopeFilters(scope);
  const key=getPickerMonth(scope,filters);
  const [y,m]=key.split('-').map(Number);
  const d=new Date(y,m-1+delta,1);
  rangePickerState[scope].month=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
  render();
  requestAnimationFrame(()=>{
    const el=document.getElementById(`range-overlay-${scope}`);
    if(el) el.classList.add('open');
  });
}

function setRangeToday(scope){
  const filters=scopeFilters(scope);
  const t=todayYMD();
  filters.customStart=t;
  filters.customEnd=t;
  rangePickerState[scope].month=t.slice(0,7);
  rangePickerState[scope].phase='start';
  render();
  requestAnimationFrame(()=>{
    const el=document.getElementById(`range-overlay-${scope}`);
    if(el) el.classList.add('open');
  });
}

function normalizeSession(s){
  if(!s)return null;
  if(!s.expires_at&&s.expires_in)s.expires_at=Math.floor(Date.now()/1000)+Number(s.expires_in||3600);
  return s;
}
function persistSession(s){

  else localStorage.removeItem(AUTH_STORAGE_KEY);

async function refreshAuthSession(){
  const current=authSession||readStoredSession();
  if(!current?.refresh_token)return null;
  try{
    const res=await fetch(SUPABASE_URL+'/auth/v1/token?grant_type=refresh_token',{
      method:'POST',headers:authHeaders(),body:JSON.stringify({refresh_token:current.refresh_token})
    });
    if(!res.ok)throw new Error('No se pudo renovar la sesión');
    const next=await res.json();
    persistSession(next);
    return authSession;
  }catch(e){
    console.warn('Auth refresh',e);
    persistSession(null);
    return null;
  }
}
async function ensureSession(allowRefresh=true){

  if(!authSession?.access_token)return null;

  if(authSession.expires_at&&Number(authSession.expires_at)<=now+90){
    return allowRefresh?await refreshAuthSession():null;
  }

}

// ============================================================
const LEGACY_MIGRATION_KEY='gap-desk-finds-legacy-migration-v161';

function readLegacyIndexedDB(){
  return new Promise((resolve)=>{
    let request;
    try{request=indexedDB.open(DB_NAME)}catch(e){return resolve({content:[],products:[],ideas:[],found:false,error:String(e)})}
    let createdFresh=false;
    request.onupgradeneeded=()=>{createdFresh=true};
    request.onerror=()=>resolve({content:[],products:[],ideas:[],found:false,error:String(request.error||'IndexedDB error')});
    request.onsuccess=()=>{
      const legacyDb=request.result;
      if(createdFresh){
        try{legacyDb.close();indexedDB.deleteDatabase(DB_NAME)}catch{}
        return resolve({content:[],products:[],ideas:[],found:false});
      }
      const wanted=['content','products','ideas'];
      const existing=wanted.filter(n=>legacyDb.objectStoreNames.contains(n));
      if(!existing.length){legacyDb.close();return resolve({content:[],products:[],ideas:[],found:false})}
      const result={content:[],products:[],ideas:[],found:true};
      let pending=existing.length;
      for(const name of existing){
        try{
          const tx=legacyDb.transaction(name,'readonly');
          const r=tx.objectStore(name).getAll();
          r.onsuccess=()=>{result[name]=Array.isArray(r.result)?r.result:[]};
          r.onerror=()=>{result[name]=[]};
          tx.oncomplete=()=>{if(--pending===0){legacyDb.close();resolve(result)}};
          tx.onerror=()=>{if(--pending===0){legacyDb.close();resolve(result)}};
          tx.onabort=()=>{if(--pending===0){legacyDb.close();resolve(result)}};
        }catch{if(--pending===0){legacyDb.close();resolve(result)}}
      }
    };
  });
}

async function migrateLegacyToCloud({force=false,interactive=false}={}){
  const cloud=await Promise.all([getAll('content'),getAll('products'),getAll('ideas')]);
  const cloudTotal=cloud.reduce((n,rows)=>n+rows.length,0);
  if(cloudTotal>0&&!force){
    return {migrated:false,reason:'cloud-not-empty',cloudTotal};
  }

  const legacy=await readLegacyIndexedDB();
  const legacyTotal=legacy.content.length+legacy.products.length+legacy.ideas.length;
  if(!legacy.found||legacyTotal===0){
    return {migrated:false,reason:'no-legacy-data',legacyTotal:0};
  }

  if(interactive){
    const ok=confirm(`Encontré ${legacy.content.length} publicaciones, ${legacy.products.length} productos y ${legacy.ideas.length} ideas guardadas en este navegador. ¿Quieres copiarlas ahora a tu nube privada de Supabase?`);
    if(!ok)return {migrated:false,reason:'cancelled',legacyTotal};
  }

  const productMap=new Map();
  let migratedProducts=0,migratedContent=0,migratedIdeas=0;

  for(const item of legacy.products){
    const oldId=item?.id;
    const newId=await add('products',item||{});
    if(oldId!=null&&newId!=null)productMap.set(String(oldId),Number(newId));
    migratedProducts++;
  }
  for(const item of legacy.content){
    const copy={...(item||{})};
    if(copy.productId!=null&&productMap.has(String(copy.productId))){
      copy.productId=productMap.get(String(copy.productId));
    }
    await add('content',copy);
    migratedContent++;
  }
  for(const item of legacy.ideas){
    await add('ideas',item||{});
    migratedIdeas++;
  }

  const summary={
    migrated:true,
    migratedAt:new Date().toISOString(),
    content:migratedContent,
    products:migratedProducts,
    ideas:migratedIdeas,
    total:migratedContent+migratedProducts+migratedIdeas
  };
  localStorage.setItem(LEGACY_MIGRATION_KEY,JSON.stringify(summary));
  return summary;
}

async function importBackup(file){
  if(!file)return;
  try{
    const d=JSON.parse(await file.text());
    if(!Array.isArray(d.content)||!Array.isArray(d.products)||!Array.isArray(d.ideas))throw new Error('Formato inválido');
    if(!confirm('Esto reemplazará tus publicaciones, productos e ideas guardados en Supabase. ¿Continuar?'))return;
    await clearStore('content');await clearStore('products');await clearStore('ideas');
    const productMap=new Map();
    for(const x of d.products){const oldId=x.id;const newId=await add('products',x);if(oldId!=null)productMap.set(Number(oldId),Number(newId));}
    for(const x of d.content){const copy={...x};if(copy.productId!=null&&productMap.has(Number(copy.productId)))copy.productId=productMap.get(Number(copy.productId));await add('content',copy);}
    for(const x of d.ideas)await add('ideas',x);
    await refresh();toast('Backup restaurado en Supabase ✓');
  }catch(e){console.error(e);alert('No pude importar ese archivo. Verifica que sea un backup válido de GAP Desk Finds.');}
}

async function startSecureDashboard(){

    await refresh();
    if(migrationResult?.migrated){

const THREAD_TYPES=['Pregunta / conversación','Opinión','Storytelling','Recomendación','Producto / afiliado','Educativo / tip','Hilo / serie','Personal / lifestyle','Otro'];
let threadInsightFilters={dimension:'hour',period:'all'};

function setThreadInsightFilter(key,value){threadInsightFilters[key]=value;render()}
function threadProductName(c){const p=state.products.find(x=>Number(x.id)===Number(c.productId));return p?.name||'Sin producto'}
function threadHasImage(c){
  if(typeof c.hasImage==='boolean')return c.hasImage;
  if(c.image)return true;
  const p=c._livePost||{};
  const mt=String(p.media_type||p.mediaType||'').toUpperCase();
  return !!(p.image_url||p.thumbnail_url||mt.includes('IMAGE')||mt.includes('CAROUSEL'));
}
function threadActualDate(c){
  const raw=c?._livePost?.posted_at||c?._livePost?.timestamp||c?.posted_at||c?.timestamp;
  if(raw){const d=new Date(raw);if(!isNaN(d))return d}
  if(c?.date){const d=new Date(c.date+'T12:00:00');if(!isNaN(d))return d}
  return null;
}
function threadTimeValue(c){
  const raw=c?._livePost?.posted_at||c?._livePost?.timestamp||c?.posted_at||c?.timestamp;
  if(raw){const d=new Date(raw);if(!isNaN(d))return d.toLocaleTimeString('es-EC',{hour:'2-digit',minute:'2-digit',hour12:false})}
  return c?.publicationTime||'—';
}
function threadHourGroup(c){
  const raw=c?._livePost?.posted_at||c?._livePost?.timestamp||c?.posted_at||c?.timestamp;
  let h=null;
  if(raw){const d=new Date(raw);if(!isNaN(d))h=d.getHours()}
  if(h===null&&/^\\d{2}:\\d{2}$/.test(c?.publicationTime||''))h=Number(c.publicationTime.slice(0,2));
  return Number.isInteger(h)?`${String(h).padStart(2,'0')}:00–${String(h).padStart(2,'0')}:59`:'Sin hora';
}
function threadTypeValue(c){return c.threadType||c.type||'Sin clasificar'}
function threadClicksValue(c){return +(c.threadClicks??c.linkClicks??c._livePost?.clicks??0)||0}
function threadFollowersGained(c){return +(c.followersGained??0)||0}
function threadInsightPeriodMatch(c){
  if(threadInsightFilters.period==='all')return true;
  const d=threadActualDate(c);if(!d)return false;
  const days=threadInsightFilters.period==='7d'?7:threadInsightFilters.period==='30d'?30:90;
  return d.getTime()>=Date.now()-days*86400000;
}
function threadInsightRows(){
  return state.content.filter(c=>c.platform==='Threads'&&c.status==='Publicado').map(hydrateThreadRecord).filter(threadInsightPeriodMatch);
}
function avg(rows,key){return rows.length?Math.round(rows.reduce((s,r)=>s+(+key(r)||0),0)/rows.length):0}
function threadGroupKey(c){
  if(threadInsightFilters.dimension==='type')return threadTypeValue(c);
  if(threadInsightFilters.dimension==='product')return threadProductName(c);
  if(threadInsightFilters.dimension==='image')return threadHasImage(c)?'Con imagen':'Sin imagen';
  return threadHourGroup(c);
}
function threadInsightGroups(rows){
  const map=new Map();
  for(const r of rows){const k=threadGroupKey(r);if(!map.has(k))map.set(k,[]);map.get(k).push(r)}
  return [...map.entries()].map(([name,items])=>({name,items,posts:items.length,views:avg(items,x=>x.views),likes:avg(items,x=>x.likes),replies:avg(items,x=>x.replies),reposts:avg(items,x=>x.reposts),followers:avg(items,threadFollowersGained),clicks:avg(items,threadClicksValue)})).sort((a,b)=>b.views-a.views);
}

const TRACKING_FUNCTION_URL=SUPABASE_URL+'/functions/v1/thread-affiliate-link';
let threadFollowerSnapshots=[];
let threadClickCounts={};
let trackingBackendStatus={followers:false,clicks:false};

function makeTrackingCode(){
  const bytes=new Uint8Array(12);crypto.getRandomValues(bytes);
  return Array.from(bytes,b=>b.toString(16).padStart(2,'0')).join('');
}
function threadTrackingUrl(c){return c?.trackingCode?`${TRACKING_PUBLIC_PAGE}?t=${encodeURIComponent(c.trackingCode)}`:''}
function copyTrackingUrl(id){
  const c=state.content.find(x=>Number(x.id)===Number(id));const url=threadTrackingUrl(c);
  if(!url)return toast('Guarda primero el Thread con un producto');
  navigator.clipboard?.writeText(url).then(()=>toast('Link de tracking copiado ✓')).catch(()=>prompt('Copia este enlace:',url));
}
async function loadFollowerSnapshots(){
  try{
    const res=await cloudFetch('/rest/v1/thread_follower_snapshots?select=followers,captured_at&order=captured_at.asc&limit=2000');
    if(!res.ok)throw new Error(await res.text());
    threadFollowerSnapshots=await res.json();trackingBackendStatus.followers=true;return threadFollowerSnapshots;
  }catch(e){console.warn('Follower snapshots unavailable',e);threadFollowerSnapshots=[];trackingBackendStatus.followers=false;return []}
}
async function captureFollowerSnapshot(){
  const t=getRemoteMetrics().threads||{},followers=Number(t.followers);
  if(!Number.isFinite(followers)||followers<0)return;
  try{
    if(!threadFollowerSnapshots.length)await loadFollowerSnapshots();
    const last=threadFollowerSnapshots[threadFollowerSnapshots.length-1];
    const age=last?Date.now()-new Date(last.captured_at).getTime():Infinity;
    if(last&&Number(last.followers)===followers&&age<45*60*1000)return;
    const res=await cloudFetch('/rest/v1/thread_follower_snapshots',{method:'POST',headers:{Prefer:'return=representation'},body:JSON.stringify({followers})});
    if(!res.ok)throw new Error(await res.text());
    const rows=await res.json();if(rows?.[0])threadFollowerSnapshots.push(rows[0]);trackingBackendStatus.followers=true;
  }catch(e){console.warn('Follower snapshot capture unavailable',e);trackingBackendStatus.followers=false}
}
async function loadThreadClickCounts(){
  try{
    const res=await cloudFetch('/rest/v1/thread_click_events?select=content_id&limit=10000');
    if(!res.ok)throw new Error(await res.text());
    const rows=await res.json(),counts={};
    rows.forEach(r=>{const k=String(r.content_id);counts[k]=(counts[k]||0)+1});
    threadClickCounts=counts;trackingBackendStatus.clicks=true;return counts;
  }catch(e){console.warn('Click tracking unavailable',e);threadClickCounts={};trackingBackendStatus.clicks=false;return {}}
}
function snapBefore(ts){
  let best=null;for(const s of threadFollowerSnapshots){const t=new Date(s.captured_at).getTime();if(t<=ts&&(!best||t>best.t))best={t,followers:+s.followers||0}}
  return best;
}
function snapAfterOrAt(ts,maxTs){
  let best=null;for(const s of threadFollowerSnapshots){const t=new Date(s.captured_at).getTime();if(t>=ts&&t<=maxTs&&(!best||t<best.t))best={t,followers:+s.followers||0}}
  return best;
}
function threadFollowerEstimate(c){
  const d=threadActualDate(c);if(!d||!threadFollowerSnapshots.length)return {value:+c.followersGained||0,source:c.followersGained?'legacy':'none',confidence:'—'};
  const start=d.getTime();
  const nextTimes=threadInsightRows().map(x=>threadActualDate(x)).filter(Boolean).map(x=>x.getTime()).filter(t=>t>start).sort((a,b)=>a-b);
  const endTarget=Math.min(start+24*3600*1000,nextTimes[0]||Infinity);
  const before=snapBefore(start);
  const after=snapAfterOrAt(start,endTarget);
  if(!before||!after||after.t<=before.t)return {value:+c.followersGained||0,source:c.followersGained?'legacy':'insufficient',confidence:'Baja'};
  const delta=Math.max(0,after.followers-before.followers);
  const gapBefore=Math.abs(start-before.t),gapAfter=Math.abs(after.t-start);
  const confidence=(gapBefore<=2*3600e3&&gapAfter<=6*3600e3)?'Alta':(gapBefore<=12*3600e3&&gapAfter<=24*3600e3?'Media':'Baja');
  return {value:delta,source:'estimated',confidence};
}
function threadFollowersGained(c){return threadFollowerEstimate(c).value}
function threadClicksValue(c){
  const tracked=threadClickCounts[String(c?.id)];
  if(trackingBackendStatus.clicks&&tracked!=null)return tracked;
  return +(c?.threadClicks??c?.linkClicks??0)||0;
}

// Threads sigue usando la API real y conserva la estimación de seguidores,
// pero ya no consulta el backend de clics propio.
loadThreadsData=async function(showToast=false){
  const result=await _loadThreadsDataV171Base(showToast);
  try{
    await loadFollowerSnapshots();
    await captureFollowerSnapshot();
    render();
  }catch(e){console.warn('Follower snapshots refresh',e)}
  return result;
};

refresh=async function(){
  await _refreshV171Base();
  try{await loadFollowerSnapshots()}catch(e){}
  render();
};

async function saveContent(e,id){
  e.preventDefault();const g=n=>document.getElementById(n),p=g('c_platform').value,existing=id?state.content.find(x=>x.id===id):{};
  const productId=+g('c_product').value||undefined;
  const obj={...existing,date:g('c_date').value,dayLabel:id?(existing?.dayLabel||dayName(g('c_date').value)):dayName(g('c_date').value),platform:p,status:g('c_status').value,objective:g('c_objective').value,type:g('c_type').value,topic:g('c_topic').value,copy:g('c_copy').value,productId,image:g('c_image').value||undefined,notes:g('c_notes').value};
  if(p==='Pinterest'){
    Object.assign(obj,{pinterestTitle:g('c_ptitle').value,pinterestDescription:g('c_pdesc').value,keywords:g('c_keywords').value,altText:g('c_alt').value});
  }else if(p==='Threads'){
    Object.assign(obj,{publicationTime:g('c_time')?.value||obj.publicationTime||'',threadType:g('c_threadType')?.value||obj.threadType||'',hasImage:g('c_hasImage')?g('c_hasImage').value==='yes':!!obj.image,views:+g('c_views')?.value||0,likes:+g('c_likes')?.value||0,replies:+g('c_replies')?.value||0,reposts:+g('c_reposts')?.value||0,quotes:+g('c_quotes')?.value||0});
  }
  if(id){obj.id=id;await put('content',obj)}else await add('content',obj);
  closeModal();await refresh();toast('Publicación guardada ✓');
}

async function saveProduct(e,id){
  e.preventDefault();const g=n=>document.getElementById(n),existing=id?state.products.find(x=>x.id===id):{};
  const obj={...existing,name:g('p_name').value,category:g('p_category').value,price:+g('p_price').value||undefined,affiliateLink:g('p_link').value,date:g('p_date').value,image:g('p_image').value||undefined,platforms:g('p_platforms').value.split(',').map(x=>x.trim()).filter(Boolean)};
  if(id){obj.id=id;await put('products',obj)}else await add('products',obj);
  closeModal();await refresh();toast('Producto guardado ✓');
}

  <div class="section-head" style="margin-top:28px"><div><h2 style="font-size:20px">Backup de tu nube privada</h2><p>Puedes exportar o restaurar publicaciones, productos e ideas.</p></div></div>
  <div class="grid data-grid gap20"><div class="card p24"><div style="font-size:25px">⬇️</div><h3>Exportar backup</h3><p class="muted">Descarga una copia JSON de tus datos actuales en Supabase.</p><button class="btn primary" onclick="exportBackup()">⬇️ Descargar backup</button></div><div class="card p24"><div style="font-size:25px">⬆️</div><h3>Importar backup</h3><p class="muted">Restaura un backup previo. Reemplazará los datos de estas tres colecciones privadas.</p><label class="btn secondary">⬆️ Elegir archivo<input class="hidden" type="file" accept="application/json" onchange="importBackup(this.files[0])"></label></div><div class="card p24"><div style="font-size:25px">🧳</div><h3>Recuperar datos anteriores</h3><p class="muted">Busca el registro editorial previo y lo copia a Supabase si tu nube está vacía.</p><button class="btn secondary" onclick="manualLegacyMigration()">🧳 Buscar datos locales</button></div></div>`;
}

// GAP DESK FINDS · V1.8.0
// Rediseño de Inicio: resumen Threads + Pinterest + Amazon Earnings Overview

  <aside class="sidebar ${state.sidebar?'open':''}">
    <div class="brand"><b>✨ GAP Desk Finds</b><small>Content Dashboard · V1.8.1</small></div>

    <div class="save-note"><b>🔒 Nube privada</b>Contenido, productos e ideas se guardan en Supabase con Auth + RLS.</div>
  </aside>
  <main class="main">
    <header class="topbar">
      <div style="display:flex;align-items:center;gap:10px">
        <button class="mobile-menu" onclick="toggleSidebar(true)">☰</button>
        <div><h1>${ic} ${title}</h1>${subtitle}</div>
      </div>
      <div class="topbar-actions">${topAction()}<span class="private-pill">🔒 Privado</span><button class="logout-btn" onclick="logoutDashboard()">Cerrar sesión</button></div>
    </header>
    <div class="content">${body}</div>
  </main>
  <nav class="mobile-bottom">
    ${['home','calendar','threads','analytics'].map(id=>`<button class="${state.section===id?'active':''}" onclick="go('${id}')"><span class="mi">${sectionMeta[id][0]}</span>${sectionMeta[id][1]}</button>`).join('')}
    <button onclick="toggleSidebar(true)"><span class="mi">☰</span>Más</button>
  </nav>`;
}

function threadsLiveSummary(){
  const r=getRemoteMetrics(),t=r.threads||{};
  if(!Object.keys(t).length)return `<div class="card p20"><div class="connection-row"><div><div class="category">🧵 Threads API</div><h3 style="margin:5px 0 0">Métricas</h3></div><span class="connection-badge off"><span class="dot"></span>Pendiente</span></div><p class="muted">Esperando datos en vivo desde Supabase.</p><button class="btn secondary" onclick="syncNow()">↻ Reintentar conexión</button></div>`;
  const eng=(+t.views||0)?((+t.likes||0)+(+t.replies||0)+(+t.reposts||0)+(+t.quotes||0))/(+t.views||1)*100:0;
  const last=r.lastSync?new Date(r.lastSync).toLocaleString('es-EC'):'—';
  return `<div class="card p20"><div class="connection-row"><div><div class="category">🧵 Threads · @${esc(t.username||'ann_pc_28')}</div><h3 style="margin:5px 0 0">Métricas</h3></div><span class="connection-badge ok"><span class="dot"></span>Conectado</span></div><div class="platform-kpis"><div class="platform-kpi"><small>Visualizaciones</small><b>${(+t.views||0).toLocaleString()}</b></div><div class="platform-kpi"><small>Seguidores</small><b>${(+t.followers||0).toLocaleString()}</b></div><div class="platform-kpi"><small>Likes</small><b>${(+t.likes||0).toLocaleString()}</b></div><div class="platform-kpi"><small>Respuestas</small><b>${(+t.replies||0).toLocaleString()}</b></div><div class="platform-kpi"><small>Engagement</small><b>${pc(eng)}</b></div><div class="platform-kpi"><small>Posts sincronizados</small><b>${(+t.postsCount||0).toLocaleString()}</b></div></div><div class="divider"></div><div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap"><small class="muted">Última sincronización: ${esc(last)}</small><button class="btn ghost" onclick="syncNow()">↻ Refrescar panel</button></div></div>`;
}

function homePinterestSummary(){
  const r=getRemoteMetrics(),p=r.pinterest||{},has=Object.keys(p).length>0;
  const imp=+p.impressions||0,saves=+p.saves||0,pinClicks=+(p.pinClicks??p.pin_clicks)||0,outbound=+(p.outboundClicks??p.outbound_clicks)||0,eng=+p.engagements||0;
  const rate=imp?eng/imp*100:0;
  return `<div class="card p20 home-pinterest-summary"><div class="connection-row"><div><div class="category">📌 Pinterest</div><h3 style="margin:5px 0 0">Métricas</h3></div>${connectionBadge(has?'connected':'pending')}</div><div class="platform-kpis"><div class="platform-kpi"><small>Impresiones</small><b>${has?imp.toLocaleString():'—'}</b></div><div class="platform-kpi"><small>Guardados</small><b>${has?saves.toLocaleString():'—'}</b></div><div class="platform-kpi"><small>Pin clicks</small><b>${has?pinClicks.toLocaleString():'—'}</b></div><div class="platform-kpi"><small>Outbound clicks</small><b>${has?outbound.toLocaleString():'—'}</b></div><div class="platform-kpi"><small>Engagement</small><b>${has?pc(rate):'—'}</b></div><div class="platform-kpi"><small>Engagements</small><b>${has?eng.toLocaleString():'—'}</b></div></div><div class="divider"></div><small class="muted">${has?'Fuente: Pinterest API → Supabase.':'Trial Access pendiente. Este resumen se llenará automáticamente cuando Pinterest habilite la API.'}</small></div>`;
}

function amazonHomeHistory(){
  const a=getRemoteMetrics().amazon||{};
  const candidates=[a.history,a.daily,a.earningsOverview,a.earnings_history,a.dailyMetrics];
  const raw=candidates.find(Array.isArray)||[];
  return raw.map((x,i)=>({
    label:String(x.label??x.date??x.day??x.period??(i+1)),
    earnings:+(x.earnings??x.commissions??x.commission??x.amount??0)||0,
    clicks:+(x.clicks??x.click_count??0)||0
  })).slice(-30);
}

function amazonEarningsOverviewHome(){
  const r=getRemoteMetrics(),a=r.amazon||{},rows=amazonHomeHistory();
  const has=rows.length>0;
  const totalEarnings=Object.keys(a).length?(+a.earnings||rows.reduce((s,x)=>s+x.earnings,0)):0;
  const totalClicks=Object.keys(a).length?(+a.clicks||rows.reduce((s,x)=>s+x.clicks,0)):0;
  const W=900,H=220,L=48,R=40,T=18,B=34,plotW=W-L-R,plotH=H-T-B;
  const n=Math.max(rows.length,1),step=plotW/n;
  const maxE=Math.max(1,...rows.map(x=>x.earnings));
  const maxC=Math.max(1,...rows.map(x=>x.clicks));
  const bars=rows.map((x,i)=>{const h=(x.clicks/maxC)*plotH;const bw=Math.max(4,Math.min(18,step*.42));const bx=L+i*step+(step-bw)/2;const by=T+plotH-h;return `<rect x="${bx.toFixed(1)}" y="${by.toFixed(1)}" width="${bw.toFixed(1)}" height="${h.toFixed(1)}" rx="3" fill="#f4cfda" opacity=".9"></rect>`}).join('');
  const points=rows.map((x,i)=>{const px=L+i*step+step/2;const py=T+plotH-(x.earnings/maxE)*plotH;return `${px.toFixed(1)},${py.toFixed(1)}`}).join(' ');
  const labels=rows.length?[[0,rows[0].label],[Math.floor((rows.length-1)/2),rows[Math.floor((rows.length-1)/2)].label],[rows.length-1,rows[rows.length-1].label]].filter((v,i,a)=>a.findIndex(z=>z[0]===v[0])===i):[];
  const grid=[0,.25,.5,.75,1].map(q=>{const y=T+plotH-(q*plotH);return `<line x1="${L}" y1="${y}" x2="${W-R}" y2="${y}" stroke="#f2e1e7" stroke-width="1"></line>`}).join('');
  return `<section class="home-amazon-overview"><div class="card p20 home-amazon-chart-card"><div class="home-amazon-head"><div><div class="category">🛍️ AMAZON AFILIADOS</div><h2>Earnings Overview</h2><p class="muted" style="margin:0">Earnings y clicks del periodo disponible.</p></div><div class="home-amazon-stats"><div class="home-amazon-stat"><small>Earnings</small><b>${Object.keys(a).length?money(totalEarnings):'—'}</b></div><div class="home-amazon-stat"><small>Clicks</small><b>${Object.keys(a).length?totalClicks.toLocaleString():'—'}</b></div></div></div><div class="home-chart-legend"><span><i class="home-chart-line-dot"></i>Earnings</span><span><i class="home-chart-bar-dot"></i>Clicks</span><span style="margin-left:auto">${has?'Datos de Amazon Reporting':'Reporting API pendiente'}</span></div><div class="home-amazon-chart-wrap"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Amazon Earnings Overview">${grid}<line x1="${L}" y1="${T+plotH}" x2="${W-R}" y2="${T+plotH}" stroke="#d9c5cd" stroke-width="1.2"></line>${bars}${points?`<polyline points="${points}" fill="none" stroke="#a95d79" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"></polyline>`:''}${labels.map(([idx,lbl])=>{const x=L+idx*step+step/2;return `<text x="${x}" y="${H-9}" text-anchor="middle" font-size="11" fill="#987e88">${esc(lbl).slice(0,12)}</text>`}).join('')}</svg>${has?'':`<div class="home-chart-empty"><div><b>Amazon Reporting API pendiente</b><br><small>El gráfico se llenará automáticamente cuando tengamos acceso.</small></div></div>`}</div></div></section>`;
}

  const pend=state.content.filter(c=>c.status==='Pendiente').length;
  const prep=state.content.filter(c=>c.status==='Preparado').length;
  return `<section class="hero">

      <div class="home-hero-main">
        <span class="pill">🔒 GAP DESK FINDS · PRIVATE CLOUD</span>
        <h2>Tu contenido y tus métricas, en un solo lugar. 🎀</h2>
        <div class="hero-actions"><button class="btn primary" onclick="openContent()">＋ Añadir contenido</button><button class="btn secondary" onclick="go('analytics')">Ver analytics →</button></div>
      </div>
      <div class="home-hero-side">
        ${metric('Contenido',state.content.length,'guardado en Supabase','📚')}
        ${metric('Ideas',state.ideas.length,pend+' pendientes · '+prep+' preparados','💡')}
      </div>
    </div>
  </section>
  <section class="home-platform-summary"><div>${threadsLiveSummary()}</div><div>${homePinterestSummary()}</div></section>
  ${amazonEarningsOverviewHome()}`;
}
