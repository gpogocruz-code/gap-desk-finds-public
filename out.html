<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GAP Desk Finds · Product Find</title>
<style>
:root{--bg:#fff8fb;--card:#fff;--line:#f1dce4;--text:#392f34;--muted:#8e7d85;--rose:#b85f7d;--rose2:#f9e6ed}*{box-sizing:border-box}body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:linear-gradient(145deg,#fff8fb,#fff);color:var(--text);min-height:100vh;display:grid;place-items:center;padding:22px}.card{width:min(520px,100%);background:#fff;border:1px solid var(--line);border-radius:28px;box-shadow:0 24px 70px rgba(75,42,55,.12);padding:24px}.brand{color:var(--rose);font-weight:900}.product{display:grid;gap:15px;margin-top:16px}.img{width:100%;max-height:340px;object-fit:contain;background:#fffafb;border:1px solid var(--line);border-radius:20px}.placeholder{height:200px;border-radius:20px;background:var(--rose2);display:grid;place-items:center;font-size:45px}.kicker{font-size:10px;font-weight:900;color:var(--rose);letter-spacing:.08em;text-transform:uppercase}h1{font-size:24px;line-height:1.2;margin:5px 0 0}.desc{color:var(--muted);font-size:14px;line-height:1.55}.btn{display:flex;text-decoration:none;align-items:center;justify-content:center;background:var(--rose);color:#fff;border-radius:16px;padding:14px 16px;font-weight:900}.btn:hover{filter:brightness(.96)}.disclosure{font-size:11px;color:#9a8a91;line-height:1.45;border-top:1px solid var(--line);padding-top:14px;margin-top:3px}.error{text-align:center;padding:28px 8px;color:var(--muted)}
</style></head><body><main class="card"><div class="brand">✨ GAP Desk Finds</div><div id="app"><div class="error">Cargando producto…</div></div></main>
<script>
const ENDPOINT='https://zuxyalskyzzzbmwgtxmf.supabase.co/functions/v1/thread-affiliate-link';
const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const code=new URLSearchParams(location.search).get('t')||'';
function eventId(){return crypto.randomUUID?crypto.randomUUID():`${Date.now()}-${Math.random().toString(16).slice(2)}`}
function recordClick(){
  const payload=JSON.stringify({code,event_id:eventId(),referrer:document.referrer||''});
  try{navigator.sendBeacon(ENDPOINT,new Blob([payload],{type:'application/json'}))}catch{fetch(ENDPOINT,{method:'POST',headers:{'Content-Type':'application/json'},body:payload,keepalive:true}).catch(()=>{})}
}
(async()=>{try{
  if(!code)throw new Error('Enlace incompleto');
  const r=await fetch(ENDPOINT+'?t='+encodeURIComponent(code),{cache:'no-store'});const d=await r.json();if(!r.ok||!d.ok)throw new Error(d.error||'Producto no disponible');
  document.getElementById('app').innerHTML=`<div class="product">${d.image?`<img class="img" src="${esc(d.image)}" alt="${esc(d.name)}">`:`<div class="placeholder">🛍️</div>`}<div><div class="kicker">Amazon Find</div><h1>${esc(d.name)}</h1></div>${d.note?`<div class="desc">${esc(d.note)}</div>`:''}<a id="amazon" class="btn" href="${esc(d.affiliate_url)}" target="_blank" rel="nofollow sponsored noopener" onclick="recordClick()">Ver en Amazon →</a><div class="disclosure">Como Afiliado de Amazon, GAP Desk Finds puede recibir una comisión por compras que cumplan los requisitos. El botón anterior abre directamente Amazon.</div></div>`;
}catch(e){document.getElementById('app').innerHTML=`<div class="error"><b>No pude abrir este producto.</b><br><br>${esc(e.message)}</div>`}})();
</script></body></html>
